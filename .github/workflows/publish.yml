# Publishes both packages on tagged GitHub releases through npm trusted
# publishing. Configure each package's publisher for this repository and
# this workflow.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      # No registry-url: npmjs.org is npm's default registry, and the
      # .npmrc that registry-url generates breaks yarn cache lookup when
      # NODE_AUTH_TOKEN is unset (OIDC needs no token).

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches both package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in packages/mpvue packages/mpvue-template-compiler; do
            ver="$(node -p "require('./$pkg/package.json').version")"
            test "v$ver" = "$RELEASE_TAG" || { echo "tag $RELEASE_TAG does not match $pkg v$ver"; exit 1; }
          done

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Run release checks
        run: |
          npm test
          yarn audit --level high

      - name: Rebuild and reject stale committed outputs
        run: |
          npm run build:mpvue
          git diff --exit-code -- packages/ || { echo 'committed package outputs are stale; rebuild and commit first'; exit 1; }

      - name: Fail if either version is already on npm
        run: |
          for pkg in packages/mpvue packages/mpvue-template-compiler; do
            name="$(node -p "require('./$pkg/package.json').name")"
            ver="$(node -p "require('./$pkg/package.json').version")"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver is already published"; exit 1
            fi
          done

      - name: Publish vue-mini-bridge
        working-directory: packages/mpvue
        run: npm publish --provenance --access public

      - name: Publish vue-mini-bridge-template-compiler
        working-directory: packages/mpvue-template-compiler
        run: npm publish --provenance --access public

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    # Major upgrades arrive only via deliberate migration PRs: each one
    # needs config, lockfile, and full-suite verification by hand.
    # The grouped bot PRs therefore carry minor and patch updates only.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # The 0.x-held dependencies treat minor bumps as breaking (proven by
      # PR #6, where flow-bin 0.48 -> 0.331 rejected .flowconfig and broke
      # the gate), so the group carries patches only for these five.
      - dependency-name: "buble"
        update-types:
          - version-update:semver-minor
      - dependency-name: "flow-bin"
        update-types:
          - version-update:semver-minor
      - dependency-name: "shelljs"
        update-types:
          - version-update:semver-minor
      - dependency-name: "weex-js-runtime"
        update-types:
          - version-update:semver-minor
      - dependency-name: "weex-vdom-tester"
        update-types:
          - version-update:semver-minor
